<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Image Prompts — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0c0c0e;
      --surface: #131316;
      --surface2: #1c1c22;
      --border: #2a2a35;
      --accent: #e8c97a;
      --accent2: #7a9ee8;
      --text: #e8e6e0;
      --muted: #6b6878;
      --tag-bg: #1e1e28;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      padding: 3rem 4rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .header-title h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .header-title h1 span {
      color: var(--accent);
      font-style: italic;
    }

    .header-title p {
      margin-top: 0.6rem;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-meta {
      font-size: 0.7rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.8;
    }

    .header-meta a {
      color: var(--accent2);
      text-decoration: none;
    }

    /* ── FILTERS ── */
    .filters {
      padding: 1.2rem 4rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .filter-btn {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.35rem 0.9rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(232,201,122,0.07);
    }

    /* ── GRID ── */
    .grid {
      padding: 3rem 4rem;
      display: flex;
      flex-direction: column;
      gap: 3rem;
    }

    /* ── CARD ── */
    .card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.5s ease forwards;
      background: var(--surface);
      transition: border-color 0.3s;
    }

    .card:hover {
      border-color: #3a3a4a;
    }

    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.15s; }
    .card:nth-child(3) { animation-delay: 0.25s; }
    .card:nth-child(4) { animation-delay: 0.35s; }
    .card:nth-child(5) { animation-delay: 0.45s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── LEFT: PROMPT PANEL ── */
    .prompt-panel {
      padding: 2.2rem 2.5rem;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }

    .card-number {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .card-title {
      font-family: 'Fraunces', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .prompt-label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.4rem;
    }

    .prompt-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 1rem 1.2rem;
      border-radius: 0 2px 2px 0;
      font-size: 0.78rem;
      line-height: 1.75;
      color: #c8c6be;
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .copy-btn.copied { color: #7ae87a; border-color: #7ae87a; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: auto;
    }

    .tag {
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 0.2rem 0.6rem;
      border-radius: 2px;
    }

    .model-badge {
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent2);
      border: 1px solid var(--accent2);
      padding: 0.2rem 0.6rem;
      border-radius: 2px;
      opacity: 0.75;
    }

    /* ── RIGHT: IMAGE PANEL ── */
    .image-panel {
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      position: relative;
      overflow: hidden;
    }

    .image-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .card:hover .image-panel img {
      transform: scale(1.03);
    }

    /* Placeholder quand pas d'image */
    .img-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      width: 100%;
      height: 100%;
      min-height: 280px;
    }

    .img-placeholder svg {
      opacity: 0.25;
    }

    .img-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 1.2rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover .img-overlay { opacity: 1; }

    /* ── FOOTER ── */
    footer {
      padding: 2rem 4rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    footer p {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .add-btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: none;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.55rem 1.2rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-btn:hover {
      background: var(--accent);
      color: var(--bg);
    }

    /* ── MODAL ADD PROMPT ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2.5rem;
      width: min(560px, 90vw);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .modal h2 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 1.4rem;
    }

    .modal label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 0.4rem;
    }

    .modal input,
    .modal textarea,
    .modal select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      padding: 0.7rem 1rem;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }

    .modal input:focus,
    .modal textarea:focus,
    .modal select:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
      margin-top: 0.5rem;
    }

    .btn-cancel {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.55rem 1.2rem;
      border-radius: 2px;
      cursor: pointer;
    }

    .btn-save {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: var(--bg);
      padding: 0.55rem 1.2rem;
      border-radius: 2px;
      cursor: pointer;
      font-weight: 700;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      header, .filters, .grid, footer { padding-left: 1.5rem; padding-right: 1.5rem; }
      .card { grid-template-columns: 1fr; }
      .prompt-panel { border-right: none; border-bottom: 1px solid var(--border); }
      .image-panel { min-height: 240px; }
    }

    /* ── NOISE TEXTURE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>

<!-- ══ HEADER ══ -->
<header>
  <div class="header-title">
    <h1>AI Image <span>Prompts</span></h1>
    <p>Bibliothèque de prompts · Génération d'images</p>
  </div>
  <div class="header-meta">
    <!-- Mets ton lien GitHub ici -->
    <a href="https://github.com/ton-username" target="_blank">github.com/ton-username</a><br>
    <span id="count-label">— entrées</span>
  </div>
</header>

<!-- ══ FILTRES ══ -->
<div class="filters">
  <button class="filter-btn active" onclick="filterCards('all', this)">Tous</button>
  <button class="filter-btn" onclick="filterCards('portrait', this)">Portrait</button>
  <button class="filter-btn" onclick="filterCards('paysage', this)">Paysage</button>
  <button class="filter-btn" onclick="filterCards('fantasy', this)">Fantasy</button>
  <button class="filter-btn" onclick="filterCards('architecture', this)">Architecture</button>
  <button class="filter-btn" onclick="filterCards('abstract', this)">Abstrait</button>
</div>

<!-- ══ GRID ══ -->
<main class="grid" id="grid">
  <!-- Les cartes sont injectées ici par JS -->
</main>

<!-- ══ FOOTER ══ -->
<footer>
  <p>Édite <code>data</code> dans le fichier JS pour ajouter tes prompts et images.</p>
  <button class="add-btn" onclick="openModal()">+ Ajouter un prompt</button>
</footer>

<!-- ══ MODAL ══ -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>Nouveau Prompt</h2>
    <div>
      <label>Titre</label>
      <input type="text" id="m-title" placeholder="Ex: Cité futuriste au coucher du soleil" />
    </div>
    <div>
      <label>Prompt</label>
      <textarea id="m-prompt" rows="4" placeholder="Décris le prompt complet ici..."></textarea>
    </div>
    <div>
      <label>Modèle IA utilisé</label>
      <select id="m-model">
        <option>Midjourney v6</option>
        <option>DALL·E 3</option>
        <option>Stable Diffusion XL</option>
        <option>Flux</option>
        <option>Firefly</option>
        <option>Autre</option>
      </select>
    </div>
    <div>
      <label>Tags (séparés par virgule)</label>
      <input type="text" id="m-tags" placeholder="portrait, cinematic, fantasy" />
    </div>
    <div>
      <label>URL de l'image (optionnel)</label>
      <input type="text" id="m-image" placeholder="https://..." />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" onclick="saveCard()">Sauvegarder</button>
    </div>
  </div>
</div>

<script>
  // ═══════════════════════════════════════════════
  //  DATA — Remplace par tes propres prompts/images
  // ═══════════════════════════════════════════════
  let data = [
    {
      title: "Portrait Cinématique",
      prompt: "A hyper-realistic cinematic portrait of a woman with silver hair, golden hour light, shallow depth of field, Hasselblad medium format, f/1.8, film grain, muted warm tones, editorial fashion photography",
      model: "Midjourney v6",
      tags: ["portrait", "cinematic"],
      image: "" // Colle ici l'URL de ton image générée
    },
    {
      title: "Cité Brutaliste Futuriste",
      prompt: "Brutalist megastructure city, aerial view, overcast sky, raw concrete textures, neon signage reflecting on wet streets, cyberpunk atmosphere, ultra-detailed, photorealistic, 8k, Blade Runner aesthetic",
      model: "DALL·E 3",
      tags: ["architecture", "futuriste"],
      image: ""
    },
    {
      title: "Forêt Enchantée",
      prompt: "Ancient enchanted forest at dawn, bioluminescent mushrooms, mist rolling through old-growth trees, soft volumetric light shafts, hyperdetailed moss textures, fantasy illustration style, by Yoshitaka Amano",
      model: "Stable Diffusion XL",
      tags: ["fantasy", "paysage"],
      image: ""
    },
    {
      title: "Abstract Géométrique",
      prompt: "Geometric abstract composition, intersecting translucent planes, deep navy and burnt orange palette, sharp shadows, Bauhaus inspired, minimalist, high contrast, print ready, vector aesthetics",
      model: "Flux",
      tags: ["abstract"],
      image: ""
    },
    {
      title: "Désert au Coucher du Soleil",
      prompt: "Vast desert landscape at golden hour, dramatic sand dunes casting long shadows, lone acacia tree silhouette, rich amber and crimson sky, national geographic photography style, long exposure, ultra-wide angle",
      model: "Midjourney v6",
      tags: ["paysage"],
      image: ""
    }
  ];

  // ═══════════════════════════════════════════════
  //  RENDER
  // ═══════════════════════════════════════════════
  function renderCards(items) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    items.forEach((item, i) => {
      const num = String(i + 1).padStart(2, '0');
      const tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
      const imgContent = item.image
        ? `<img src="${item.image}" alt="${item.title}" loading="lazy" /><div class="img-overlay">${item.title}</div>`
        : `<div class="img-placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span>image à coller</span>
          </div>`;

      grid.innerHTML += `
        <article class="card" data-tags="${item.tags.join(',')}">
          <div class="prompt-panel">
            <span class="card-number">№ ${num}</span>
            <h2 class="card-title">${item.title}</h2>
            <div>
              <div class="prompt-label">Prompt</div>
              <div class="prompt-box">
                ${item.prompt}
                <button class="copy-btn" onclick="copyPrompt(this, \`${item.prompt.replace(/`/g,'\\`')}\`)">Copier</button>
              </div>
            </div>
            <div class="tags">
              <span class="model-badge">${item.model}</span>
              ${tagsHtml}
            </div>
          </div>
          <div class="image-panel">${imgContent}</div>
        </article>`;
    });
    document.getElementById('count-label').textContent = `${items.length} entrée${items.length > 1 ? 's' : ''}`;
  }

  // ═══════════════════════════════════════════════
  //  COPY
  // ═══════════════════════════════════════════════
  function copyPrompt(btn, text) {
    navigator.clipboard.writeText(text);
    btn.textContent = 'Copié!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copier'; btn.classList.remove('copied'); }, 2000);
  }

  // ═══════════════════════════════════════════════
  //  FILTER
  // ═══════════════════════════════════════════════
  function filterCards(tag, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (tag === 'all') return renderCards(data);
    renderCards(data.filter(d => d.tags.includes(tag)));
  }

  // ═══════════════════════════════════════════════
  //  MODAL
  // ═══════════════════════════════════════════════
  function openModal() { document.getElementById('modal').classList.add('open'); }
  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  function saveCard() {
    const title  = document.getElementById('m-title').value.trim();
    const prompt = document.getElementById('m-prompt').value.trim();
    const model  = document.getElementById('m-model').value;
    const tags   = document.getElementById('m-tags').value.split(',').map(t => t.trim()).filter(Boolean);
    const image  = document.getElementById('m-image').value.trim();
    if (!title || !prompt) return alert('Titre et prompt obligatoires.');
    data.push({ title, prompt, model, tags, image });
    renderCards(data);
    closeModal();
    ['m-title','m-prompt','m-tags','m-image'].forEach(id => document.getElementById(id).value = '');
  }

  // Close modal on overlay click
  document.getElementById('modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  // ═══════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════
  renderCards(data);
</script>
</body>
</html>
