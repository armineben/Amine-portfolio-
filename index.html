<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amine BENALI — Portfolio</title>
<script src="contenu.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #0F6E56;
  --blue: #003DA5; --blue-light: #E8F0FB;
  --text-primary: #1a1a1a; --text-secondary: #555; --text-muted: #999;
  --border: #e8e8e8; --bg: #fafaf8;
}
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; }

/* NAVIGATION */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250,250,248,0.95); backdrop-filter: blur(12px);
  border-bottom: 0.5px solid var(--border);
  padding: 0 2rem; display: flex; align-items: center;
  justify-content: space-between; height: 56px;
}
.nav-logo { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text-primary); text-decoration: none; }
.nav-logo span { color: var(--green); }
.nav-contact {
  font-size: 12px; padding: 6px 16px; border-radius: 20px;
  background: var(--green); color: white; text-decoration: none; font-weight: 500;
  transition: background 0.15s;
}

/* HERO SECTION */
.hero { max-width: 860px; margin: 0 auto; padding: 4rem 2rem 2rem; text-align: center; }
.hero-name { font-family: 'Playfair Display', serif; font-size: 2.8rem; font-weight: 600; line-height: 1.1; margin-bottom: 1rem; }
.hero-name span { color: var(--green); }
.hero-desc { font-size: 15px; color: var(--text-secondary); max-width: 500px; margin: 0 auto 2rem; line-height: 1.7; }

/* GRID CATEGORIES */
.categories { max-width: 860px; margin: 0 auto; padding: 0 2rem 4rem; }
.cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.cat-card {
  background: white; border: 0.5px solid var(--border);
  border-radius: 16px; overflow: hidden; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.cat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
.cat-card-header { padding: 1.5rem 1.5rem 1rem; display: flex; align-items: flex-start; justify-content: space-between; }
.cat-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.cat-count { font-size: 11px; color: var(--text-muted); background: var(--bg); padding: 3px 8px; border-radius: 10px; }
.cat-preview { height: 110px; overflow: hidden; margin: 0 1rem; border-radius: 10px; background: var(--bg); display: flex; gap: 4px; }
.cat-preview img { flex: 1; min-width: 0; object-fit: cover; }
.cat-card-footer { padding: 1rem 1.5rem 1.25rem; }
.cat-name { font-size: 15px; font-weight: 600; }

/* MODAL & GALLERY */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
}
.modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
.modal { background: white; border-radius: 20px; width: 100%; max-width: 760px; overflow: hidden; }
.modal-header { padding: 1.5rem 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid var(--border); }
.modal-body { padding: 1.5rem 2rem; }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.gallery-item { border-radius: 10px; overflow: hidden; border: 0.5px solid var(--border); aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; background: var(--bg); text-decoration: none; }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; }

/* LIGHTBOX */
.lightbox { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; }
.lightbox.open { display: flex; }
.lightbox img { max-width: 90vw; max-height: 90vh; }

@media (max-width: 640px) { .cat-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="#"><span>A</span>mine BENALI</a>
  <a class="nav-contact" href="mailto:aminebenali3@gmail.com">Contact</a>
</nav>

<div class="hero">
  <h1 class="hero-name">Amine <span>BENALI</span></h1>
  <p class="hero-desc">Portfolio Digital & Communication</p>
</div>

<div class="categories">
  <div class="cat-grid">
    <!-- CARTE LOGOS -->
    <div class="cat-card" onclick="openModal('logos')">
      <div class="cat-card-header"><div class="cat-icon" style="background:#FAEEDA;">◉</div><span class="cat-count" id="count-logos">0</span></div>
      <div class="cat-preview" id="preview-logos"></div>
      <div class="cat-card-footer"><p class="cat-name">Logos</p></div>
    </div>
    <!-- CARTE AFFICHES -->
    <div class="cat-card" onclick="openModal('affiches')">
      <div class="cat-card-header"><div class="cat-icon" style="background:#E1F5EE;">◈</div><span class="cat-count" id="count-affiches">0</span></div>
      <div class="cat-preview" id="preview-affiches"></div>
      <div class="cat-card-footer"><p class="cat-name">Affiches & Vidéos</p></div>
    </div>
    <!-- CARTE PROJETS -->
    <div class="cat-card" onclick="openModal('projets')">
      <div class="cat-card-header"><div class="cat-icon" style="background:#FAECE7;">🌐</div><span class="cat-count" id="count-projets">0</span></div>
      <div class="cat-preview" id="preview-projets"></div>
      <div class="cat-card-footer"><p class="cat-name">Projets Web</p></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Galerie</h2>
      <button onclick="document.getElementById('modal-overlay').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
  <img id="lightbox-img" src="">
</div>

<script>
const CATEGORIES = {
  logos: { folder: 'images/images/logos/' },
  affiches: { folder: 'images/images/affiches/' },
  projets: { folder: '' }
};

function getFileType(f) {
  if (f.includes('drive.google.com')) return 'video';
  const ext = f.split('.').pop().toLowerCase();
  if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) return 'image';
  if (ext === 'html') return 'html';
  return 'file';
}

function load() {
  if (typeof PORTFOLIO_CONTENU === 'undefined') return;
  Object.keys(CATEGORIES).forEach(key => {
    const files = PORTFOLIO_CONTENU[key] || [];
    document.getElementById('count-' + key).textContent = files.length;
    const preview = document.getElementById('preview-' + key);
    if (files.length > 0) {
      let html = '';
      files.slice(0, 3).forEach(f => {
        const type = getFileType(f);
        const path = f.startsWith('http') ? f : CATEGORIES[key].folder + f;
        if (type === 'image') html += `<img src="${path}">`;
        else html += `<div style="flex:1; display:flex; align-items:center; justify-content:center; background:#eee;">${type === 'video' ? '🎬' : '📄'}</div>`;
      });
      preview.innerHTML = html;
    }
  });
}

function openModal(key) {
  const files = PORTFOLIO_CONTENU[key] || [];
  const body = document.getElementById('modal-body');
  body.innerHTML = `<div class="gallery-grid">` + files.map(f => {
    const type = getFileType(f);
    const path = f.startsWith('http') ? f : CATEGORIES[key].folder + f;
    if (type === 'image') return `<div class="gallery-item" onclick="openLightbox('${path}')"><img src="${path}"></div>`;
    if (type === 'video') return `<a class="gallery-item" href="${path}" target="_blank" style="flex-direction:column; background:#E8F0FB;"><span>🎬</span><p style="font-size:10px; color:#003DA5;">Voir la Vidéo</p></a>`;
    if (type === 'html') return `<a class="gallery-item" href="${path}" target="_blank" style="flex-direction:column; background:#E1F5EE;"><span>🌐</span><p style="font-size:10px; color:#0F6E56;">${f}</p></a>`;
    return `<a class="gallery-item" href="${path}" target="_blank"><span>📄</span></a>`;
  }).join('') + `</div>`;
  document.getElementById('modal-overlay').classList.add('open');
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}

function closeModal(e) { if (e.target.id === 'modal-overlay') e.target.classList.remove('open'); }

document.addEventListener('DOMContentLoaded', load);
</script>
</body>
</html>
